{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Создать новый проект</h2>
    <form method="post" enctype="multipart/form-data">  <!-- Добавь enctype -->
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Название проекта *</label>
            <input type="text" name="title" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Описание</label>
            <textarea name="description" rows="5" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem;">Обложка проекта</label>
            <input type="file" name="cover" accept="image/*" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
            <small style="color: #666;">Рекомендуемый размер: 400x300px. Поддерживаются JPG, PNG, GIF</small>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn">Создать</button>
            <a href="{% url 'project_list' %}" style="padding: 10px 20px; background: #666; color: white; text-decoration: none; border-radius: 5px;">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
